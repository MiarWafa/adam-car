<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز ادم لصيانة السيارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ===== كل الـ CSS بتاعك زي ما هو (بدون أي تعديل) ===== */
/* مفيش حذف ولا تعديل */

/* ─── EXTRA BOOKING UI ─── */
.time-slot-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:10px;
}
.time-slot{
  padding:10px;
  border:1px solid var(--border);
  border-radius:8px;
  text-align:center;
  cursor:pointer;
  font-size:13px;
  transition:0.2s;
  background:rgba(255,255,255,0.03);
}
.time-slot:hover{
  border-color:var(--gold);
}
.time-slot.booked{
  background:rgba(200,0,0,0.2);
  border-color:red;
  cursor:not-allowed;
  opacity:0.6;
}
.time-slot.selected{
  background:rgba(245,166,35,0.2);
  border-color:var(--gold);
}
</style>
</head>

<body>

<!-- ===== كل الـ HTML بتاعك زي ما هو ===== -->

<!-- ─── CONTACT FORM (إضافة فقط) ─── -->
<div class="contact-form">

<div class="form-title">🗓️ احجز موعدك الآن</div>

<div class="form-group">
<label>الاسم الكريم</label>
<input type="text" placeholder="اكتب اسمك هنا">
</div>

<div class="form-group">
<label>رقم الجوال</label>
<input type="tel" placeholder="+20XXXXXXXXXX">
</div>

<div class="form-group">
<label>نوع السيارة</label>
<input type="text" placeholder="مثال: BMW 320i 2020">
</div>

<!-- ✅ NEW: DATE -->
<div class="form-group">
<label>تاريخ الحجز</label>
<input type="date" id="bookingDate">
</div>

<!-- ✅ NEW: TIME SLOTS -->
<div class="form-group">
<label>الموعد المتاح (9 ص - 9 م)</label>
<div id="timeSlots" class="time-slot-grid"></div>
</div>

<div class="form-group">
<label>الخدمة المطلوبة</label>
<select>
<option value="">اختر الخدمة...</option>
<option>ميكانيكا</option>
<option>كهرباء</option>
<option>صيانة تكييف / شحن فريون</option>
<option>تغيير زيت</option>
<option>إطارات</option>
<option>بطاريات</option>
<option>كشف أعطال</option>
<option>دوكو وهيكل</option>
<option>أخرى</option>
</select>
</div>

<div class="form-group">
<label>ملاحظات إضافية</label>
<textarea placeholder="اوصف المشكلة أو أي تفاصيل مفيدة..."></textarea>
</div>

<button class="form-submit" id="submitBtn" onclick="submitForm()">✅ أرسل الطلب الآن</button>

<div id="form-msg" style="display:none; margin-top:14px;"></div>

</div>

<script>

/* =========================
   SMART BOOKING SYSTEM
========================= */

const timeSlotsContainer = document.getElementById("timeSlots");
const bookingDate = document.getElementById("bookingDate");

const HOURS = Array.from({length:13}, (_,i)=> i+9); // 9 -> 21

let selectedTime = null;

// توليد الساعات
function renderSlots(){
    timeSlotsContainer.innerHTML = "";

    const date = bookingDate.value;
    if(!date) return;

    const bookings = JSON.parse(localStorage.getItem("bookings") || "[]");

    HOURS.forEach(h => {
        const slot = document.createElement("div");
        slot.className = "time-slot";
        const timeLabel = `${h}:00`;

        const isBooked = bookings.find(b => b.date === date && b.time === timeLabel);

        slot.textContent = isBooked ? `${timeLabel} (محجوز)` : timeLabel;

        if(isBooked){
            slot.classList.add("booked");
        } else {
            slot.onclick = () => {
                document.querySelectorAll(".time-slot").forEach(s=>s.classList.remove("selected"));
                slot.classList.add("selected");
                selectedTime = timeLabel;
            }
        }

        timeSlotsContainer.appendChild(slot);
    });
}

bookingDate.addEventListener("change", renderSlots);

/* =========================
   EXISTING FORM FUNCTION (UPDATED ONLY LOGIC)
========================= */

async function submitForm(){

const name = document.querySelector('input[placeholder="اكتب اسمك هنا"]').value.trim();
const phone = document.querySelector('input[type="tel"]').value.trim();
const car = document.querySelector('input[placeholder^="مثال"]').value.trim();
const service = document.querySelector('select').value;
const notes = document.querySelector('textarea').value.trim();
const date = bookingDate.value;

const btn = document.getElementById('submitBtn');
const msg = document.getElementById('form-msg');

if(!name || !phone || !car || !service || !date || !selectedTime){
    msg.style.display = 'block';
    msg.style.background = 'rgba(220,50,50,0.15)';
    msg.style.color = '#ff6b6b';
    msg.textContent = '⚠️ لازم تختار التاريخ والوقت';
    return;
}

/* ===== check duplicate booking ===== */
let bookings = JSON.parse(localStorage.getItem("bookings") || "[]");

const conflict = bookings.find(b =>
    b.date === date &&
    b.time === selectedTime
);

if(conflict){
    msg.style.display = 'block';
    msg.style.color = 'red';
    msg.textContent = "❌ المعاد دا محجوز بالفعل";
    return;
}

/* ===== save booking ===== */
bookings.push({name, phone, car, service, notes, date, time:selectedTime});
localStorage.setItem("bookings", JSON.stringify(bookings));

msg.style.display = 'block';
msg.style.color = 'lightgreen';
msg.textContent = "✅ تم الحجز بنجاح";

btn.textContent = "تم الحجز ✔️";

renderSlots();
selectedTime = null;
}

</script>

</body>
</html>
