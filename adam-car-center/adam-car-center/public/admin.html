<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم | مركز آدم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #f5a623; --orange: #ff6b00; --dark: #080810; --dark2: #0f0f1a;
            --dark3: #161628; --border: rgba(245,166,35,0.2); --border-bright: rgba(245,166,35,0.45);
            --text: #fff; --muted: rgba(255,255,255,0.55);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Cairo',sans-serif; background:var(--dark); color:var(--text); min-height:100vh; }

        header { background:rgba(8,8,16,0.95); border-bottom:1px solid var(--border); backdrop-filter:blur(12px); position:sticky; top:0; z-index:100; padding:0 5%; height:64px; display:flex; align-items:center; justify-content:space-between; }
        .header-logo { font-size:18px; font-weight:900; color:var(--gold); }
        .logout-btn { background:transparent; border:1px solid rgba(255,100,100,0.3); color:#ff8888; font-size:13px; font-weight:700; padding:6px 16px; border-radius:8px; cursor:pointer; text-decoration: none; }
        
        .main { padding:32px 5%; max-width:1200px; margin:0 auto; }
        .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:28px; }
        .stat-card { background:var(--dark3); border:1px solid var(--border); border-radius:14px; padding:20px; text-align:center; position: relative; overflow: hidden; }
        .stat-card .num { font-size:28px; font-weight:900; color:var(--gold); }
        .stat-card .lbl { font-size:12px; color:var(--muted); margin-top:4px; }

        .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; align-items:center; }
        .filter-btn { background:var(--dark3); border:1px solid var(--border); color:var(--muted); font-size:13px; font-weight:700; padding:8px 18px; border-radius:8px; cursor:pointer; }
        .filter-btn.active { border-color:var(--gold); color:var(--gold); background:rgba(245,166,35,0.08); }

        .table-wrap { overflow-x:auto; border-radius:16px; border:1px solid var(--border); background: var(--dark2); }
        table { width:100%; border-collapse:collapse; min-width: 900px; }
        thead th { background:var(--dark3); padding:14px 16px; font-size:13px; color:var(--gold); text-align:right; border-bottom:1px solid var(--border); }
        td { padding:14px 16px; font-size:14px; color:var(--muted); border-bottom:1px solid rgba(255,255,255,0.03); }
        
        .status-badge { font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; display:inline-block; }
        .s-جديد { background:rgba(245,166,35,0.1); color:var(--gold); }
        .s-تم_التواصل { background:rgba(52,152,219,0.1); color:#5dade2; }
        .s-مكتمل { background:rgba(39,174,96,0.1); color:#2ecc71; }
        .s-ملغي { background:rgba(220,50,50,0.1); color:#ff6b6b; }

        /* Modal Style */
        #expenseModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center; }
        .modal-content { background:var(--dark3); border:1px solid var(--gold); padding:25px; border-radius:15px; width:90%; max-width:400px; }
        .modal-content h3 { color:var(--gold); margin-bottom:15px; }
        .modal-content input { width:100%; padding:10px; margin-bottom:10px; background:var(--dark); border:1px solid var(--border); color:white; border-radius:5px; }
        .modal-btns { display:flex; gap:10px; margin-top:10px; }
        .save-btn { flex:1; background:var(--gold); border:none; padding:10px; border-radius:5px; font-weight:bold; cursor:pointer; }
        .cancel-btn { flex:1; background:#444; border:none; color:white; padding:10px; border-radius:5px; cursor:pointer; }
    </style>
</head>
<body>

    <header>
        <div class="header-logo">🚗 مركز آدم - الإدارة المباشرة</div>
        <a href="/logout" class="logout-btn">خروج المسؤول</a>
    </header>

    <div class="main">
        <div class="stats-row">
            <div class="stat-card">
                <div class="num" id="totalBadge">0</div>
                <div class="lbl">إجمالي الحجوزات</div>
            </div>
            <div class="stat-card" style="border-color: rgba(220,50,50,0.3)">
                <div class="num" id="dashCosts" style="color:#ff6b6b">0</div>
                <div class="lbl">إجمالي المصروفات</div>
            </div>
            <div class="stat-card" style="border-color: rgba(39,174,96,0.3)">
                <div class="num" id="dashProfits" style="color:#2ecc71">0</div>
                <div class="lbl">صافي الأرباح</div>
            </div>
        </div>

        <div class="toolbar">
            <button class="filter-btn active" onclick="setFilter('الكل',this)">عرض الكل</button>
            <button class="filter-btn" onclick="setFilter('مكتمل',this)">🟢 المكتمل</button>
            <button class="refresh-btn" onclick="loadData()" style="margin-right:auto; background:none; border:1px solid var(--gold); color:var(--gold); padding:5px 15px; border-radius:5px; cursor:pointer;">🔄 تحديث</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>العميل</th>
                        <th>السيارة</th>
                        <th>الموعد</th>
                        <th>الحالة</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="expenseModal">
        <div class="modal-content">
            <h3>إضافة مصروفات السيارة</h3>
            <input type="text" id="expItem" placeholder="اسم القطعة / الخدمة">
            <input type="number" id="expCost" placeholder="تكلفة القطعة عليك">
            <input type="number" id="expSell" placeholder="سعر البيع للعميل">
            <div class="modal-btns">
                <button class="save-btn" onclick="saveExpense()">حفظ الفاتورة</button>
                <button class="cancel-btn" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        let allBookings = [];
        let currentFilter = 'الكل';
        let activeBookingId = null;

        window.onload = loadData;

        function loadData() {
            fetch('/api/dashboard')
            .then(r => r.json())
            .then(data => {
                if(data.success) {
                    allBookings = data.bookings;
                    document.getElementById('totalBadge').textContent = allBookings.length;
                    document.getElementById('dashCosts').textContent = data.total_costs.toLocaleString() + ' ج.م';
                    document.getElementById('dashProfits').textContent = data.total_profits.toLocaleString() + ' ج.م';
                    renderTable();
                }
            });
        }

        function renderTable() {
            const filtered = currentFilter === 'الكل' ? allBookings : allBookings.filter(b => b.status === currentFilter);
            const tbody = document.getElementById('tableBody');
            
            tbody.innerHTML = filtered.map((b, index) => {
                const sc = b.status.replace(' ', '_');
                return `<tr>
                    <td style="color:var(--gold)">${index + 1}</td>
                    <td><b>${b.name}</b><br><small>${b.phone}</small></td>
                    <td>${b.car}<br><small style="color:var(--gold)">${b.service}</small></td>
                    <td>${b.booking_date}<br><small>${b.booking_time}</small></td>
                    <td><span class="status-badge s-${sc}">${b.status}</span></td>
                    <td>
                        <select onchange="handleStatusChange(${b.id}, this.value)" style="background:#111; color:white; border:1px solid #333; padding:4px; border-radius:5px;">
                            <option value="">تعديل...</option>
                            <option value="تم التواصل">تم التواصل</option>
                            <option value="مكتمل">مكتمل</option>
                            <option value="ملغي">حذف الحجز</option>
                        </select>
                    </td>
                </tr>`;
            }).join('');
        }

        function handleStatusChange(id, status) {
            if(!status) return;
            
            if(status === 'ملغي') {
                if(confirm('حذف الحجز نهائياً؟')) {
                    fetch('/api/bookings/'+id, {method:'DELETE'}).then(() => loadData());
                }
                return;
            }

            activeBookingId = id;
            if(status === 'تم التواصل' || status === 'مكتمل') {
                // تحديث الحالة أولاً ثم فتح نافذة المصروفات
                fetch('/api/bookings/'+id, {
                    method:'PATCH', 
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({status})
                }).then(() => {
                    document.getElementById('expenseModal').style.display = 'flex';
                });
            }
        }

        function saveExpense() {
            const item = document.getElementById('expItem').value;
            const cost = document.getElementById('expCost').value;
            const sell = document.getElementById('expSell').value;

            if(!item || !cost || !sell) return alert('يرجى ملء كافة البيانات');

            fetch('/api/expenses', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ booking_id: activeBookingId, item, cost, sell })
            }).then(r => r.json()).then(d => {
                if(d.success) {
                    closeModal();
                    loadData();
                }
            });
        }

        function closeModal() {
            document.getElementById('expenseModal').style.display = 'none';
            document.getElementById('expItem').value = '';
            document.getElementById('expCost').value = '';
            document.getElementById('expSell').value = '';
        }

        function setFilter(f, btn) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable();
        }
    </script>
</body>
</html>
