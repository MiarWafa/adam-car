<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم | مركز آدم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
:root {
    --gold:#f5a623;
    --dark:#080810;
    --dark3:#161628;
    --border:rgba(245,166,35,0.2);
    --muted:rgba(255,255,255,0.6);
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Cairo;background:var(--dark);color:#fff}

header{
    padding:15px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--border);
    position:sticky;top:0;
    background:rgba(8,8,16,0.95);
}

.main{padding:30px 5%;max-width:1200px;margin:auto}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:20px;
}

.card{
    background:var(--dark3);
    border:1px solid var(--border);
    padding:15px;
    text-align:center;
    border-radius:10px;
}

.num{font-size:28px;color:var(--gold);font-weight:900}

table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:12px;border-bottom:1px solid #222;text-align:right;font-size:14px}

th{color:var(--gold);background:var(--dark3)}

.status{padding:4px 10px;border-radius:20px;font-size:12px}
.new{color:#f5a623}
.done{color:#2ecc71}
.contact{color:#5dade2}
.canceled{color:#ff6b6b}

.btn{
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold);
    padding:5px 10px;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <h3>🚗 لوحة تحكم مركز آدم</h3>
    <a href="/logout" style="color:#ff6b6b">خروج</a>
</header>

<div class="main">

<!-- Stats -->
<div class="stats">
    <div class="card"><div class="num" id="all">0</div>إجمالي</div>
    <div class="card"><div class="num" id="new">0</div>جديد</div>
    <div class="card"><div class="num" id="done">0</div>مكتمل</div>
    <div class="card"><div class="num" id="contact">0</div>تواصل</div>
</div>

<!-- Table -->
<table>
<thead>
<tr>
<th>#</th>
<th>الاسم</th>
<th>الجوال</th>
<th>السيارة</th>
<th>الخدمة</th>
<th>ملاحظات</th>
<th>المالية</th>
<th>الحالة</th>
<th>التاريخ</th>
<th>إجراءات</th>
</tr>
</thead>

<tbody id="tbody"></tbody>
</table>

</div>

<script>

let bookings = [];

async function load(){
    const res = await fetch('/api/bookings');
    const data = await res.json();

    if(!data.success) return;

    bookings = data.bookings;

    render();
}

function render(){

    document.getElementById('all').innerText = bookings.length;
    document.getElementById('new').innerText = bookings.filter(b=>b.status==='جديد').length;
    document.getElementById('done').innerText = bookings.filter(b=>b.status==='مكتمل').length;
    document.getElementById('contact').innerText = bookings.filter(b=>b.status==='تم التواصل').length;

    let html = '';

    bookings.forEach((b,i)=>{

        let cost = 0;
        let profit = 0;

        (b.expenses || []).forEach(e=>{
            cost += Number(e.cost_price || 0);
            profit += Number(e.profit || 0);
        });

        let statusClass =
            b.status === 'جديد' ? 'new' :
            b.status === 'مكتمل' ? 'done' :
            b.status === 'تم التواصل' ? 'contact' : 'canceled';

        html += `
        <tr>
            <td>${b.id}</td>
            <td>${b.name}</td>
            <td>${b.phone}</td>
            <td>${b.car}</td>
            <td>${b.service}</td>
            <td>${b.notes || '-'}</td>

            <td>
                <div style="color:#f5a623">مصروف: ${cost}</div>
                <div style="color:#2ecc71">ربح: ${profit}</div>

                <button class="btn" onclick="addExpense(${b.id})">+ إضافة</button>
            </td>

            <td class="${statusClass}">${b.status}</td>

            <td>${b.created_at}</td>

            <td>
                <select onchange="updateStatus(${b.id},this.value)">
                    <option value="">تغيير</option>
                    <option>جديد</option>
                    <option>تم التواصل</option>
                    <option>مكتمل</option>
                    <option>ملغي</option>
                </select>

                <button onclick="del(${b.id})" style="color:red">🗑</button>
            </td>
        </tr>
        `;
    });

    document.getElementById('tbody').innerHTML = html;
}

async function updateStatus(id,status){
    await fetch('/api/bookings/'+id,{
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({status})
    });
    load();
}

async function del(id){
    if(!confirm('حذف؟')) return;

    await fetch('/api/bookings/'+id,{method:'DELETE'});
    load();
}

async function addExpense(id){

    const item_name = prompt('اسم المصروف');
    if(!item_name) return;

    const cost_price = prompt('سعر الشراء');
    const sell_price = prompt('سعر البيع');

    await fetch(`/api/bookings/${id}/expense`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            item_name,
            cost_price,
            sell_price
        })
    });

    load();
}

load();

setInterval(load, 10000);

</script>

</body>
</html>
