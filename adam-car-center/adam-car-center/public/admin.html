<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم | مركز آدم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --gold: #f5a623; --orange: #ff6b00;
    --dark: #080810; --dark2: #0f0f1a; --dark3: #161628;
    --border: rgba(245,166,35,0.2); --border-bright: rgba(245,166,35,0.45);
    --text: #fff; --muted: rgba(255,255,255,0.55);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Cairo',sans-serif; background:var(--dark); color:var(--text); min-height:100vh; }

  #dashboard { display:block; }

  header {
    background:rgba(8,8,16,0.95);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(12px);
    position:sticky;
    top:0;
    z-index:100;
    padding:0 5%;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .header-logo { font-size:18px; font-weight:900; color:var(--gold); }

  .header-right { display:flex; align-items:center; gap:16px; }

  .badge-count {
    background:rgba(245,166,35,0.15);
    border:1px solid var(--border);
    color:var(--gold);
    font-size:12px;
    font-weight:700;
    padding:4px 14px;
    border-radius:20px;
  }

  .logout-btn {
    background:transparent;
    border:1px solid rgba(255,100,100,0.3);
    color:#ff8888;
    font-size:13px;
    font-weight:700;
    padding:6px 16px;
    border-radius:8px;
    cursor:pointer;
  }

  .main { padding:32px 5%; max-width:1200px; margin:0 auto; }

  .stats-row {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:28px;
  }

  .stat-card {
    background:var(--dark3);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    text-align:center;
  }

  .stat-card .num { font-size:32px; font-weight:900; color:var(--gold); }
  .stat-card .lbl { font-size:12px; color:var(--muted); margin-top:4px; }

  .toolbar {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
    align-items:center;
  }

  .filter-btn {
    background:var(--dark3);
    border:1px solid var(--border);
    color:var(--muted);
    font-size:13px;
    font-weight:700;
    padding:8px 18px;
    border-radius:8px;
    cursor:pointer;
  }

  .filter-btn.active, .filter-btn:hover {
    border-color:var(--gold);
    color:var(--gold);
  }

  .refresh-btn {
    margin-right:auto;
    background:rgba(245,166,35,0.1);
    border:1px solid var(--border-bright);
    color:var(--gold);
    font-size:13px;
    font-weight:700;
    padding:8px 18px;
    border-radius:8px;
    cursor:pointer;
  }

  table { width:100%; border-collapse:collapse; }

  thead th {
    background:var(--dark3);
    padding:14px 16px;
    font-size:13px;
    color:var(--gold);
    text-align:right;
    border-bottom:1px solid var(--border);
  }

  tbody tr { border-bottom:1px solid rgba(255,255,255,0.04); }

  td {
    padding:14px 16px;
    font-size:14px;
    color:var(--muted);
  }

  td.name { color:#fff; font-weight:700; }

  .status-badge {
    font-size:12px;
    font-weight:700;
    padding:4px 12px;
    border-radius:20px;
    display:inline-block;
  }

  .s-جديد { color:var(--gold); }
  .s-تم_التواصل { color:#5dade2; }
  .s-مكتمل { color:#2ecc71; }
  .s-ملغي { color:#ff6b6b; }

  .action-select {
    background:var(--dark2);
    border:1px solid var(--border);
    color:#fff;
    padding:5px 10px;
    border-radius:8px;
  }

  .del-btn {
    background:none;
    border:none;
    color:#ff6b6b;
    cursor:pointer;
    font-size:16px;
  }

</style>
</head>

<body>

<div id="dashboard">

<header>
  <div class="header-logo">🚗 لوحة التحكم</div>

  <div class="header-right">
    <span class="badge-count" id="totalBadge">0</span>
    <button class="logout-btn" onclick="location.href='/logout'">خروج</button>
  </div>
</header>

<div class="main">

<!-- Stats -->
<div class="stats-row">
  <div class="stat-card"><div class="num" id="all">0</div><div class="lbl">كل الحجوزات</div></div>
  <div class="stat-card"><div class="num" id="new">0</div><div class="lbl">جديد</div></div>
  <div class="stat-card"><div class="num" id="done">0</div><div class="lbl">مكتمل</div></div>
  <div class="stat-card"><div class="num" id="contact">0</div><div class="lbl">تم التواصل</div></div>
</div>

<!-- Table -->
<table>
  <thead>
    <tr>
      <th>#</th>
      <th>الاسم</th>
      <th>الجوال</th>
      <th>السيارة</th>
      <th>الخدمة</th>
      <th>الحالة</th>
      <th>الموعد</th> <!-- NEW -->
      <th>المصروفات</th> <!-- NEW -->
      <th>إجراء</th>
    </tr>
  </thead>

  <tbody id="body"></tbody>
</table>

</div>
</div>

<script>
let data = [];

function load() {
  fetch('/api/bookings')
  .then(r => r.json())
  .then(d => {
    data = d.bookings;
    render();
  });
}

function render() {
  document.getElementById('body').innerHTML =
  data.map(b => `
    <tr>
      <td>${b.id}</td>
      <td class="name">${b.name}</td>
      <td>${b.phone}</td>
      <td>${b.car}</td>
      <td>${b.service}</td>

      <td>
        <span class="status-badge s-${b.status.replace(' ','_')}">${b.status}</span>
      </td>

      <!-- NEW SLOT (جاهز للمواعيد) -->
      <td>${b.appointment || '—'}</td>

      <!-- NEW EXPENSES -->
      <td>${b.expenses || '0'} EGP</td>

      <td>
        <select class="action-select" onchange="update(${b.id},this.value)">
          <option>جديد</option>
          <option>تم التواصل</option>
          <option>مكتمل</option>
          <option>ملغي</option>
        </select>
        <button class="del-btn" onclick="del(${b.id})">🗑</button>
      </td>
    </tr>
  `).join('');
}

function update(id,status){
  fetch('/api/bookings/'+id,{
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({status})
  }).then(()=>load());
}

function del(id){
  fetch('/api/bookings/'+id,{method:'DELETE'}).then(()=>load());
}

load();
setInterval(load,5000);
</script>

</body>
</html>
