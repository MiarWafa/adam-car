<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم | مركز آدم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #f5a623; --orange: #ff6b00;
    --dark: #080810; --dark2: #0f0f1a; --dark3: #161628;
    --border: rgba(245,166,35,0.2); --border-bright: rgba(245,166,35,0.45);
    --text: #fff; --muted: rgba(255,255,255,0.55);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Cairo',sans-serif; background:var(--dark); color:var(--text); min-height:100vh; }

  /* Dashboard */
  #dashboard { display:block; } /* تم التعديل لتظهر مباشرة بعد الحماية من السيرفر */

  header {
    background:rgba(8,8,16,0.95); border-bottom:1px solid var(--border);
    backdrop-filter:blur(12px); position:sticky; top:0; z-index:100;
    padding:0 5%; height:64px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .header-logo { font-size:18px; font-weight:900; color:var(--gold); }
  .header-right { display:flex; align-items:center; gap:16px; }
  .badge-count {
    background:rgba(245,166,35,0.15); border:1px solid var(--border);
    color:var(--gold); font-size:12px; font-weight:700;
    padding:4px 14px; border-radius:20px;
  }
  .logout-btn {
    background:transparent; border:1px solid rgba(255,100,100,0.3);
    color:#ff8888; font-size:13px; font-weight:700;
    padding:6px 16px; border-radius:8px; cursor:pointer;
    font-family:'Cairo',sans-serif; transition:background 0.2s;
  }
  .logout-btn:hover { background:rgba(255,100,100,0.1); }

  .main { padding:32px 5%; max-width:1300px; margin:0 auto; }

  /* Stats */
  .stats-row {
    display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px;
  }
  .stat-card {
    background:var(--dark3); border:1px solid var(--border); border-radius:14px;
    padding:20px; text-align:center;
  }
  .stat-card .num { font-size:32px; font-weight:900; color:var(--gold); }
  .stat-card .lbl { font-size:12px; color:var(--muted); margin-top:4px; }

  /* Filter */
  .toolbar {
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; align-items:center;
  }
  .filter-btn {
    background:var(--dark3); border:1px solid var(--border); color:var(--muted);
    font-size:13px; font-weight:700; padding:8px 18px; border-radius:8px;
    cursor:pointer; font-family:'Cairo',sans-serif; transition:all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover { border-color:var(--gold); color:var(--gold); background:rgba(245,166,35,0.08); }
  
  .exp-btn {
    background:rgba(52,152,219,0.1); border:1px solid rgba(52,152,219,0.4); color:#5dade2;
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:6px;
    cursor:pointer; font-family:'Cairo',sans-serif; transition:all 0.2s;
  }
  .exp-btn:hover { background:rgba(52,152,219,0.2); }

  .refresh-btn {
    margin-right:auto; background:rgba(245,166,35,0.1); border:1px solid var(--border-bright);
    color:var(--gold); font-size:13px; font-weight:700; padding:8px 18px;
    border-radius:8px; cursor:pointer; font-family:'Cairo',sans-serif;
  }

  /* Table */
  .table-wrap { overflow-x:auto; border-radius:16px; border:1px solid var(--border); }
  table { width:100%; border-collapse:collapse; }
  thead th {
    background:var(--dark3); padding:14px 16px;
    font-size:13px; font-weight:700; color:var(--gold);
    text-align:right; border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  tbody tr { border-bottom:1px solid rgba(255,255,255,0.04); transition:background 0.15s; }
  tbody tr:last-child { border-bottom:none; }
  tbody tr:hover { background:rgba(255,255,255,0.03); }
  td { padding:14px 16px; font-size:14px; color:var(--muted); vertical-align:middle; }
  td.name { color:#fff; font-weight:700; }
  td.phone a { color:var(--gold); text-decoration:none; font-weight:700; }
  td.date { font-size:12px; white-space:nowrap; }

  .status-badge {
    display:inline-block; font-size:12px; font-weight:700;
    padding:4px 12px; border-radius:20px;
  }
  .s-جديد      { background:rgba(245,166,35,0.15); color:var(--gold);   border:1px solid rgba(245,166,35,0.3); }
  .s-تم_التواصل { background:rgba(52,152,219,0.15); color:#5dade2;      border:1px solid rgba(52,152,219,0.3); }
  .s-مكتمل     { background:rgba(39,174,96,0.15);  color:#2ecc71;       border:1px solid rgba(39,174,96,0.3); }
  .s-ملغي      { background:rgba(220,50,50,0.12);  color:#ff6b6b;       border:1px solid rgba(220,50,50,0.3); }

  .action-select {
    background:var(--dark2); border:1px solid var(--border); color:#fff;
    font-family:'Cairo',sans-serif; font-size:12px; padding:5px 10px;
    border-radius:8px; outline:none; cursor:pointer; margin-bottom: 4px;
  }

  .del-btn {
    background:none; border:none; color:#ff6b6b; font-size:16px;
    cursor:pointer; padding:4px 8px; border-radius:6px;
    transition:background 0.2s;
  }
  .del-btn:hover { background:rgba(220,50,50,0.15); }

  .empty { text-align:center; padding:60px 20px; color:var(--muted); font-size:16px; }

  /* Modal Expenses */
  .modal {
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(8,8,16,0.85); backdrop-filter:blur(6px); z-index:1000;
    align-items:center; justify-content:center;
  }
  .modal-content {
    background:var(--dark3); border:1px solid var(--border); border-radius:16px;
    padding:24px; width:100%; max-width:450px;
  }
  .modal h3 { color:var(--gold); margin-bottom:16px; font-size:18px; }
  .expenses-list { max-height:220px; overflow-y:auto; margin-bottom:16px; padding-left:10px; }
  .expense-item {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px; border-bottom:1px solid rgba(255,255,255,0.05); font-size:14px;
  }
  .expense-item .desc { color:#fff; }
  .expense-item .cost { color:var(--gold); font-weight:700; }
  .exp-inputs { display:flex; gap:10px; margin-bottom:12px; }
  
  .form-input {
    background:rgba(255,255,255,0.05); border:1px solid var(--border);
    border-radius:8px; color:#fff; font-family:'Cairo',sans-serif;
    font-size:13px; padding:10px 12px; outline:none; transition:border-color 0.2s;
    width:100%;
  }
  .form-input:focus { border-color:var(--gold); }
  
  .btn-primary {
    width:100%; background:linear-gradient(135deg,var(--gold),var(--orange));
    color:#000; font-weight:900; font-size:14px; padding:10px;
    border-radius:8px; border:none; cursor:pointer; font-family:'Cairo',sans-serif;
  }
  .btn-primary:hover { opacity:0.9; }

  /* Scrollbar */
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(245,166,35,0.3); border-radius:4px; }

  @media(max-width:768px) {
    .stats-row { grid-template-columns:1fr 1fr; }
    .main { padding:20px 4%; }
  }
</style>
</head>
<body>

<!-- Dashboard -->
<div id="dashboard">
  <header>
    <div class="header-logo">🚗 لوحة التحكم</div>
    <div class="header-right">
      <span class="badge-count" id="totalBadge">0 حجز</span>
      <button class="logout-btn" onclick="logout()">خروج</button>
    </div>
  </header>

  <div class="main">
    <div class="stats-row" id="statsRow">
      <div class="stat-card"><div class="num" id="sAll">0</div><div class="lbl">إجمالي الحجوزات</div></div>
      <div class="stat-card"><div class="num" id="sNew" style="color:#f5a623">0</div><div class="lbl">جديد</div></div>
      <div class="stat-card"><div class="num" id="sDone" style="color:#2ecc71">0</div><div class="lbl">مكتمل</div></div>
      <div class="stat-card"><div class="num" id="sContact" style="color:#5dade2">0</div><div class="lbl">تم التواصل</div></div>
    </div>

    <div class="toolbar">
      <button class="filter-btn active" onclick="setFilter('الكل',this)">الكل</button>
      <button class="filter-btn" onclick="setFilter('جديد',this)">🟡 جديد</button>
      <button class="filter-btn" onclick="setFilter('تم التواصل',this)">🔵 تم التواصل</button>
      <button class="filter-btn" onclick="setFilter('مكتمل',this)">🟢 مكتمل</button>
      <button class="filter-btn" onclick="setFilter('ملغي',this)">🔴 ملغي</button>
      <button class="refresh-btn" onclick="loadBookings()">🔄 تحديث</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>الاسم</th>
            <th>الجوال</th>
            <th>السيارة</th>
            <th>الخدمة</th>
            <th>موعد الحجز</th>
            <th>ملاحظات</th>
            <th>الحالة</th>
            <th>المصروفات</th>
            <th>تاريخ الإنشاء</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal المصروفات -->
<div id="expensesModal" class="modal">
  <div class="modal-content">
    <h3>💸 مصروفات وقطع غيار (حجز #<span id="expBookingId"></span>)</h3>
    <div id="expensesList" class="expenses-list"></div>
    <div class="exp-inputs">
      <input type="text" id="expDesc" class="form-input" placeholder="الوصف (مثال: تغيير زيت، تيل فرامل)">
      <input type="number" id="expCost" class="form-input" placeholder="التكلفة" style="width:100px">
    </div>
    <button class="btn-primary" onclick="addExpense()">➕ إضافة مصروف</button>
    <button class="logout-btn" onclick="closeExpenses()" style="margin-top:12px; width:100%">إغلاق</button>
  </div>
</div>

<script>
  let allBookings = [];
  let currentFilter = 'الكل';
  let currentExpBooking = null;

  // جلب البيانات تلقائياً عند فتح الصفحة (الاعتماد على Session)
  window.onload = loadBookings;

  function loadBookings() {
    fetch('/api/bookings')
      .then(r => r.json())
      .then(data => { 
        if (data.success) { 
          allBookings = data.bookings; 
          renderAll(); 
        } 
      })
      .catch(err => console.error("Error loading bookings:", err));
  }

  function logout() {
    window.location.href = '/logout';
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  }

  function renderAll() {
    const total   = allBookings.length;
    const newB    = allBookings.filter(b => b.status === 'جديد').length;
    const done    = allBookings.filter(b => b.status === 'مكتمل').length;
    const contact = allBookings.filter(b => b.status === 'تم التواصل').length;

    document.getElementById('sAll').textContent     = total;
    document.getElementById('sNew').textContent     = newB;
    document.getElementById('sDone').textContent    = done;
    document.getElementById('sContact').textContent = contact;
    document.getElementById('totalBadge').textContent = total + ' حجز';

    renderTable();
  }

  function renderTable() {
    const filtered = currentFilter === 'الكل'
      ? allBookings
      : allBookings.filter(b => b.status === currentFilter);

    const tbody = document.getElementById('tableBody');
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="11" class="empty">📋 لا يوجد حجوزات</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(b => {
      const sc = b.status.replace(' ', '_');
      
      // تفاصيل تاريخ الإنشاء
      const date = b.created_at ? b.created_at.split(' ')[0] : '—';
      const time = b.created_at ? b.created_at.split(' ')[1]?.slice(0,5) : '';
      
      // تفاصيل الموعد المطلوب
      const appDate = b.appointment_date || '—';
      const appTime = b.appointment_time || '';

      // زر المصروفات
      const expensesBtn = b.status === 'تم التواصل' 
        ? `<button class="exp-btn" onclick="openExpenses(${b.id})">💸 أضف / عرض</button>` 
        : `<span style="font-size:11px; color:var(--muted)">غير متاح</span>`;

      return `
        <tr>
          <td style="color:var(--gold);font-weight:700">#${b.id}</td>
          <td class="name">${esc(b.name)}</td>
          <td class="phone"><a href="tel:${esc(b.phone)}">${esc(b.phone)}</a></td>
          <td>${esc(b.car)}</td>
          <td>${esc(b.service)}</td>
          <td class="date" style="color:var(--gold)">${esc(appDate)}<br><span style="color:#fff">${esc(appTime)}</span></td>
          <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(b.notes)}">${esc(b.notes||'—')}</td>
          <td><span class="status-badge s-${sc}">${esc(b.status)}</span></td>
          <td>${expensesBtn}</td>
          <td class="date">${date}<br><span style="opacity:.5;font-size:11px">${time}</span></td>
          <td>
            <select class="action-select" onchange="changeStatus(${b.id}, this.value)" data-current="${esc(b.status)}">
              <option value="">تغيير الحالة...</option>
              <option value="جديد" ${b.status === 'جديد' ? 'selected' : ''}>جديد</option>
              <option value="تم التواصل" ${b.status === 'تم التواصل' ? 'selected' : ''}>تم التواصل</option>
              <option value="مكتمل" ${b.status === 'مكتمل' ? 'selected' : ''}>مكتمل</option>
              <option value="ملغي" ${b.status === 'ملغي' ? 'selected' : ''}>ملغي</option>
            </select>
            <br>
            <button class="del-btn" onclick="deleteBooking(${b.id})" title="حذف الحجز">🗑 حذف</button>
          </td>
        </tr>`;
    }).join('');
  }

  function changeStatus(id, status) {
    if (!status) return;
    fetch('/api/bookings/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    }).then(r => r.json()).then(d => { if (d.success) loadBookings(); });
  }

  function deleteBooking(id) {
    if (!confirm('هل أنت متأكد من الحذف التام للحجز وكل بياناته؟')) return;
    fetch('/api/bookings/' + id, { method: 'DELETE' })
      .then(r => r.json())
      .then(d => { if (d.success) loadBookings(); });
  }

  /* ──────── المصروفات ──────── */
  function openExpenses(bid) {
    currentExpBooking = bid;
    document.getElementById('expBookingId').textContent = bid;
    document.getElementById('expensesModal').style.display = 'flex';
    loadExpensesList();
  }

  function closeExpenses() {
    document.getElementById('expensesModal').style.display = 'none';
    currentExpBooking = null;
    document.getElementById('expDesc').value = '';
    document.getElementById('expCost').value = '';
  }

  function loadExpensesList() {
    const listDiv = document.getElementById('expensesList');
    listDiv.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:12px;">جاري التحميل...</div>';
    
    fetch(`/api/bookings/${currentExpBooking}/expenses`)
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          if (data.expenses.length === 0) {
            listDiv.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:12px;">لا يوجد مصروفات مسجلة حتى الآن</div>';
          } else {
            let total = 0;
            listDiv.innerHTML = data.expenses.map(e => {
              total += parseFloat(e.cost);
              return `
                <div class="expense-item">
                  <span class="desc">${esc(e.description)}</span>
                  <span class="cost">${e.cost} ج</span>
                </div>
              `;
            }).join('');
            // إضافة الإجمالي
            listDiv.innerHTML += `
              <div class="expense-item" style="border-top:1px dashed var(--border); margin-top:5px;">
                <span class="desc" style="color:var(--gold); font-weight:bold;">الإجمالي</span>
                <span class="cost">${total} ج</span>
              </div>
            `;
          }
        }
      });
  }

  function addExpense() {
    const desc = document.getElementById('expDesc').value.trim();
    const cost = document.getElementById('expCost').value.trim();

    if (!desc || !cost) {
      alert("يرجى إدخال الوصف والتكلفة");
      return;
    }

    fetch(`/api/bookings/${currentExpBooking}/expenses`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: desc, cost: cost })
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        document.getElementById('expDesc').value = '';
        document.getElementById('expCost').value = '';
        loadExpensesList(); // إعادة تحميل القائمة
      } else {
        alert(data.message || "حدث خطأ");
      }
    });
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // تحديث تلقائي كل 60 ثانية للوحة التحكم
  setInterval(loadBookings, 60000);
</script>
</body>
</html>
